<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>مستكشف المواد</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
<style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#102033;--muted:#64748b;--primary:#0f766e;--primary2:#115e59;--line:#e2e8f0;--soft:#ecfdf5;--danger:#b91c1c;--shadow:0 12px 35px rgba(15,23,42,.08)}
*{box-sizing:border-box} body{margin:0;background:linear-gradient(180deg,#eef8f6 0,#f8fafc 260px,var(--bg) 100%);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;color:var(--ink)}
.container{width:min(1120px,calc(100% - 28px));margin:auto}
header{padding:34px 0 20px}.brand{display:flex;align-items:center;gap:14px}.logo{width:52px;height:52px;border-radius:16px;background:linear-gradient(135deg,var(--primary),#14b8a6);display:grid;place-items:center;color:#fff;font-size:25px;box-shadow:0 10px 25px rgba(15,118,110,.22)}
h1{margin:0;font-size:clamp(25px,4vw,36px)} .subtitle{color:var(--muted);margin:5px 0 0}
.card{background:var(--card);border:1px solid rgba(226,232,240,.9);border-radius:22px;box-shadow:var(--shadow)}
.search-card{padding:20px;margin:14px 0 18px}.tabs{display:flex;gap:8px;margin-bottom:14px}.tab{border:1px solid var(--line);background:#fff;padding:9px 14px;border-radius:12px;cursor:pointer;font-weight:700;color:var(--muted)}.tab.active{background:#ecfdf5;color:var(--primary2);border-color:#a7f3d0}
.search-row{display:grid;grid-template-columns:1fr auto auto;gap:10px}.input-wrap{position:relative}.input{width:100%;padding:15px 16px;border:1px solid #cbd5e1;border-radius:14px;font-size:16px;outline:none;transition:.2s}.input:focus{border-color:#14b8a6;box-shadow:0 0 0 4px rgba(20,184,166,.12)}
.btn{border:0;border-radius:14px;padding:0 18px;min-height:50px;font-size:15px;font-weight:800;cursor:pointer}.primary{background:var(--primary);color:#fff}.primary:hover{background:var(--primary2)}.secondary{background:#f1f5f9;color:#334155}.scan{background:#0f172a;color:#fff}
.status{margin-top:12px;color:var(--muted);font-size:14px}.status.ok{color:#047857}.status.err{color:var(--danger)}
.result-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:22px 0 12px}.result-head h2{font-size:20px;margin:0}.count{color:var(--muted);font-size:14px}
.results{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;padding-bottom:40px}.item{padding:18px}.item-title{font-size:18px;font-weight:850;margin:0 0 14px;color:#0f172a}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.field{background:#f8fafc;border-radius:12px;padding:10px 12px;min-width:0}.label{display:block;color:var(--muted);font-size:12px;margin-bottom:4px}.value{font-size:14px;word-break:break-word}
.empty{padding:42px;text-align:center;color:var(--muted)} footer{padding:4px 0 30px;color:var(--muted);font-size:12px}
.modal{position:fixed;inset:0;background:rgba(2,6,23,.72);display:none;align-items:center;justify-content:center;padding:18px;z-index:20}.modal.show{display:flex}.modal-card{background:#fff;width:min(520px,100%);border-radius:22px;padding:16px}.modal-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.close{border:0;background:#f1f5f9;border-radius:10px;padding:8px 12px;cursor:pointer;font-weight:800}#reader{width:100%;overflow:hidden;border-radius:14px}.hint{font-size:13px;color:var(--muted);padding:10px 2px 2px}
@media(max-width:720px){.search-row{grid-template-columns:1fr 1fr}.input-wrap{grid-column:1/-1}.results{grid-template-columns:1fr}.fields{grid-template-columns:1fr}.search-card{padding:15px}.btn{width:100%}}
</style>
</head>
<body>
<div class="container">
<header><div class="brand"><div class="logo">⌕</div><div><h1>مستكشف المواد</h1><p class="subtitle">بحث سريع داخل دليل المواد</p></div></div></header>

<section class="card search-card">
  <div class="tabs">
    <button class="tab active" data-mode="name">اسم المادة</button>
    <button class="tab" data-mode="barcode">الباركود</button>
  </div>
  <div class="search-row">
    <div class="input-wrap"><input id="q" class="input" autocomplete="off" placeholder="اكتب اسم المادة..." aria-label="بحث"></div>
    <button id="searchBtn" class="btn primary">بحث</button>
    <button id="scanBtn" class="btn scan">📷 مسح الباركود</button>
  </div>
  <div id="status" class="status">جاري تحميل دليل المواد...</div>
</section>

<div class="result-head"><h2>النتائج</h2><span id="count" class="count"></span></div>
<section id="results" class="results"></section>
<footer>يتم تحميل ملف دليل_المواد.xlsx تلقائيًا من نفس مجلد الموقع.</footer>
</div>

<div id="modal" class="modal">
 <div class="modal-card">
  <div class="modal-top"><strong>مسح الباركود</strong><button id="closeModal" class="close">إغلاق</button></div>
  <div id="reader"></div>
  <div class="hint">اسمح للموقع باستخدام الكاميرا. سيتم تفضيل الكاميرا الخلفية على الهواتف.</div>
 </div>
</div>

<script>
let rows=[], headers=[], nameCol=-1, barcodeCol=-1, mode='name', scanner=null;
const nameCandidates=['الاسم العربي للمادة','اسم المادة','المادة','المنتج','الصنف','material','product','name'];
const barcodeCandidates=['الباركود','باركود','رقم الباركود','barcode','ean','upc','code','sku'];
const norm=s=>String(s??'').trim().toLowerCase().replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/[ًٌٍَُِّْـ]/g,'').replace(/\s+/g,' ');
function findCol(cands){
  const ns=headers.map(h=>norm(h));
  for(const c of cands){const i=ns.indexOf(norm(c));if(i>=0)return i}
  for(let i=0;i<ns.length;i++) if(cands.some(c=>ns[i].includes(norm(c)))) return i;
  return -1;
}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function setStatus(t,cls=''){const e=document.getElementById('status');e.textContent=t;e.className='status '+cls}
function render(list){
 const out=document.getElementById('results'), count=document.getElementById('count');
 count.textContent=list.length ? `${list.length} نتيجة` : '';
 if(!list.length){out.innerHTML='<div class="card empty">لا توجد نتائج مطابقة.</div>';return}
 out.innerHTML=list.slice(0,100).map(r=>{
   const title=nameCol>=0 && r[headers[nameCol]] ? r[headers[nameCol]] : 'مادة';
   const vals=headers.map(h=>[h,r[h]]).filter(([h,v])=>String(v??'').trim()!=='');
   return `<article class="card item"><h3 class="item-title">${esc(title)}</h3><div class="fields">${vals.map(([h,v])=>`<div class="field"><span class="label">${esc(h)}</span><span class="value">${esc(v)}</span></div>`).join('')}</div></article>`;
 }).join('');
}
function barcodeNorm(s){
  let x=String(s??'').trim().toLowerCase();
  // Remove common separators while preserving the actual barcode characters.
  x=x.replace(/[\u200e\u200f\u202a-\u202e\s\-_.]/g,'');
  return x;
}
function barcodeMatches(cell, term){
  const t=barcodeNorm(term);
  if(!t) return false;
  const raw=String(cell??'');
  // The Excel file may contain more than one barcode in the same cell,
  // e.g. "1100003&1100004".
  const parts=raw.split(/[&,;|\/\\]+/).map(barcodeNorm).filter(Boolean);
  if(parts.some(p=>p===t)) return true;
  // Also allow a substring match for cells with prefixes/suffixes.
  return barcodeNorm(raw).includes(t);
}
function search(){
 const term=norm(document.getElementById('q').value);
 if(!term){render([]);document.getElementById('count').textContent='';return}
 const col=mode==='name'?nameCol:barcodeCol;
 if(col<0){setStatus('لم يتم العثور على عمود الباركود في ملف Excel.','err');render([]);return}
 const list=rows.filter(r=>{
   const value=r[headers[col]];
   return mode==='barcode' ? barcodeMatches(value,term) : norm(value).includes(term);
 });
 render(list);
}
async function loadData(){
 try{
  const res=await fetch('دليل_المواد.xlsx',{cache:'no-store'});
  if(!res.ok) throw new Error('HTTP '+res.status);
  const buf=await res.arrayBuffer();
  const wb=XLSX.read(buf,{type:'array'});
  const ws=wb.Sheets[wb.SheetNames[0]];
  rows=XLSX.utils.sheet_to_json(ws,{defval:''});
  headers=XLSX.utils.sheet_to_json(ws,{header:1,defval:''})[0]||[];
  nameCol=findCol(nameCandidates); barcodeCol=findCol(barcodeCandidates);
  setStatus(`تم تحميل ${rows.length.toLocaleString('ar')} سجلًا بنجاح.`,'ok');
  render([]);
 }catch(e){setStatus('تعذر تحميل ملف Excel. تأكد أن index.html وملف دليل_المواد.xlsx في نفس المجلد وأن الموقع يعمل عبر استضافة/خادم ويب.','err');console.error(e)}
}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{
 document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');
 mode=b.dataset.mode;document.getElementById('q').placeholder=mode==='name'?'اكتب اسم المادة...':'اكتب الباركود...';document.getElementById('q').focus();search();
});
document.getElementById('q').addEventListener('input',search);
document.getElementById('searchBtn').onclick=search;

async function startScan(){
 const modal=document.getElementById('modal'); modal.classList.add('show');
 try{
  scanner=new Html5Qrcode('reader');
  await scanner.start({facingMode:{exact:'environment'}},{fps:10,qrbox:{width:260,height:140}},
   code=>{document.getElementById('q').value=String(code).trim();mode='barcode';document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.mode==='barcode'));setStatus('تمت قراءة الباركود: '+String(code).trim(),'ok');stopScan();search()},
   ()=>{});
 }catch(e){
  try{
   await scanner.start({facingMode:'environment'},{fps:10,qrbox:{width:260,height:140}},
    code=>{document.getElementById('q').value=String(code).trim();mode='barcode';document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.mode==='barcode'));setStatus('تمت قراءة الباركود: '+String(code).trim(),'ok');stopScan();search()},
    ()=>{});
  }catch(err){document.getElementById('reader').innerHTML='<div class="empty">تعذر تشغيل الكاميرا. تأكد من منح إذن الكاميرا واستخدام الموقع عبر HTTPS.</div>';}
 }
}
async function stopScan(){if(scanner){try{await scanner.stop();}catch(e){}try{scanner.clear();}catch(e){}scanner=null}document.getElementById('modal').classList.remove('show')}
document.getElementById('scanBtn').onclick=startScan;
document.getElementById('closeModal').onclick=stopScan;
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')stopScan()});
loadData();
</script>
</body>
</html>
